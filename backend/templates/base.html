<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}İnsan Ekspertizi - Yapay Zeka Destekli Analiz{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Kök Renkler (Karanlık Tema ve Mor Detaylar) */
        :root {
            --bg-color: #0f172a; /* Koyu lacivert arka plan */
            --text-color: #f8fafc; /* Beyaz/gri metin */
            --primary-color: #8b5cf6; /* Ekspertiz Moru */
            --header-bg: #1e293b; /* Menü arka planı */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- ÜST MENÜ (HEADER) --- */
        header {
            background-color: var(--header-bg);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* Açılır Menü (Dropdown) */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--header-bg);
            min-width: 220px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 10;
            border-radius: 8px;
            margin-top: 10px;
            overflow: hidden;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            padding: 12px 16px;
            display: block;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dropdown-content a:hover {
            background-color: var(--primary-color);
            color: white !important;
        }

        .btn-login {
            background-color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 8px;
            color: white !important;
            font-weight: bold;
        }

        .btn-login:hover {
            background-color: #7c3aed;
        }

        /* --- ANA İÇERİK --- */
        main {
            flex: 1;
            padding: 40px;
        }

        /* --- ALT BİLGİ (FOOTER) --- */
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--header-bg);
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo"><i class="fa-solid fa-fingerprint"></i> İNSANEKSPERTİZİ</a>
        <nav class="nav-links">
            <a href="/">Ana Sayfa</a>
            
            <div class="dropdown">
                <a href="#" style="cursor: pointer;">Hizmetlerimiz <i class="fa-solid fa-chevron-down" style="font-size: 0.8em;"></i></a>
                <div class="dropdown-content">
                    <a href="/#analiz">İsim Analizi</a>
                    <a href="/#analiz">Rüya Tabiri</a>
                    <a href="#" onclick="alert('Yüz Analizi çok yakında eklenecek!')" style="color: #94a3b8;">Yüz Analizi (Fizyonomi)</a>
                    <a href="#" onclick="alert('El Falı çok yakında eklenecek!')" style="color: #94a3b8;">El Falı (Kiromansi)</a>
                    <a href="#" onclick="alert('Numeroloji çok yakında eklenecek!')" style="color: #94a3b8;">Numeroloji</a>
                    <a href="#" onclick="alert('Doğal Taş modülü çok yakında!')" style="color: #94a3b8;">Doğal Taş Uyumu</a>
                </div>
            </div>

            <a href="/blog">Blog</a>
            <a href="/hakkimizda">Hakkımızda</a>
            <a href="/iletisim">İletişim</a>
            <a href="#" class="btn-login">Giriş Yap</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 İnsan Ekspertizi. Tüm Hakları Saklıdır.</p>
    </footer>

</body>
</html>
